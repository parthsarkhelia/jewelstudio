[tool.poetry]
name = "jewelstudio-backend"
version = "0.1.0"
description = "JewelStudio 3D processing backend"
authors = ["JewelStudio Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.0"
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.0.0"
boto3 = "^1.35.0"
trimesh = {extras = ["easy"], version = "^4.5.0"}
pygltflib = "^1.16.0"
pyjwt = "^2.10.0"
python-multipart = "^0.0.18"
pydantic-settings = "^2.6.0"
httpx = "^0.28.0"
pillow = "^11.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
