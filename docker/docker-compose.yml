services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jewelstudio
      POSTGRES_PASSWORD: jewelstudio_dev
      POSTGRES_DB: jewelstudio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jewelstudio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: jewelstudio
      MINIO_ROOT_PASSWORD: jewelstudio_dev
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 jewelstudio jewelstudio_dev;
      mc mb --ignore-existing local/jewelstudio-models;
      mc mb --ignore-existing local/jewelstudio-thumbnails;
      mc mb --ignore-existing local/jewelstudio-exports;
      mc anonymous set download local/jewelstudio-thumbnails;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
