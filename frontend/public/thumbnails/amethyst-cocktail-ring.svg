<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="100%" stop-color="#ede8e1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a84b"/>
      <stop offset="40%" stop-color="#f5d998"/>
      <stop offset="60%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#b8922f"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8922f"/>
      <stop offset="100%" stop-color="#8a6e22"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c49a3c"/>
      <stop offset="50%" stop-color="#fffbe6"/>
      <stop offset="100%" stop-color="#c49a3c"/>
    </linearGradient>
    <radialGradient id="amethyst" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#bb88ee"/>
      <stop offset="30%" stop-color="#9966cc"/>
      <stop offset="65%" stop-color="#7744aa"/>
      <stop offset="100%" stop-color="#6b3fa0"/>
    </radialGradient>
    <radialGradient id="amethystShine" cx="32%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#ddbbff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ddbbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amethystDeep" cx="65%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#4a2280" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a2280" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smallDiamond" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#b8d8ff"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#00000022"/>
    </filter>
    <filter id="gemGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#7744aa35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Ring band back -->
    <path d="M171 330 Q171 375 215 390 Q245 398 268 390 Q312 375 341 330"
          fill="none" stroke="url(#goldDark)" stroke-width="16" stroke-linecap="round" opacity="0.4"/>
    <!-- Ring band front -->
    <path d="M171 330 Q171 280 210 262 Q230 254 248 252 L268 252 Q288 254 306 262 Q341 280 341 330"
          fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
    <!-- Band highlight -->
    <path d="M175 328 Q175 282 212 265 Q231 257 249 255 L267 255 Q287 257 304 265 Q337 282 337 328"
          fill="none" stroke="url(#goldHighlight)" stroke-width="5" opacity="0.45" stroke-linecap="round"/>
    <!-- Lower band -->
    <path d="M171 330 Q171 375 215 390 Q245 398 268 390 Q312 375 341 330"
          fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    <!-- Ornate setting frame -->
    <ellipse cx="256" cy="195" rx="72" ry="62" fill="url(#gold)" stroke="url(#goldDark)" stroke-width="1.5"/>
    <!-- Filigree scrollwork on setting -->
    <g stroke="url(#goldDark)" stroke-width="1" fill="none" opacity="0.25">
      <path d="M195 195 Q200 180 210 185 Q215 195 208 200"/>
      <path d="M317 195 Q312 180 302 185 Q297 195 304 200"/>
      <path d="M210 235 Q218 242 225 238 Q228 230 222 226"/>
      <path d="M302 235 Q294 242 287 238 Q284 230 290 226"/>
    </g>
    <!-- Inner gold bezel -->
    <ellipse cx="256" cy="192" rx="58" ry="50" fill="url(#goldDark)" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
    <!-- Diamond halo around amethyst -->
    <g>
      <circle cx="256" cy="142" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="274" cy="145" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="290" cy="153" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="302" cy="166" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="308" cy="182" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="308" cy="200" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="302" cy="216" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="290" cy="228" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="274" cy="236" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="256" cy="240" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="238" cy="236" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="222" cy="228" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="210" cy="216" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="204" cy="200" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="204" cy="182" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="210" cy="166" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="222" cy="153" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
      <circle cx="238" cy="145" r="4.5" fill="url(#smallDiamond)" stroke="url(#gold)" stroke-width="0.5"/>
    </g>
    <!-- Main amethyst stone - large oval -->
    <g filter="url(#gemGlow)">
      <ellipse cx="256" cy="190" rx="42" ry="38" fill="url(#amethyst)" stroke="#4a2280" stroke-width="0.8"/>
      <!-- Facet pattern -->
      <path d="M256 152 L280 175 L275 210 L237 210 L232 175 Z" fill="none" stroke="#8855bb" stroke-width="0.5" opacity="0.3"/>
      <path d="M256 152 L256 190" fill="none" stroke="#9966cc" stroke-width="0.4" opacity="0.2"/>
      <path d="M232 175 L256 190 L280 175" fill="none" stroke="#9966cc" stroke-width="0.4" opacity="0.2"/>
      <!-- Shine overlay -->
      <ellipse cx="256" cy="190" rx="42" ry="38" fill="url(#amethystShine)"/>
      <!-- Depth overlay -->
      <ellipse cx="256" cy="190" rx="42" ry="38" fill="url(#amethystDeep)"/>
      <!-- Sparkle -->
      <circle cx="242" cy="175" r="2.5" fill="white" opacity="0.3"/>
      <circle cx="246" cy="170" r="1.2" fill="white" opacity="0.5"/>
    </g>
    <!-- Prongs connecting setting to band -->
    <path d="M220 248 L215 255 L210 262" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M292 248 L297 255 L302 262" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>