<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="100%" stop-color="#ede8e1"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="35%" stop-color="#e8e8e8"/>
      <stop offset="65%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="silverLink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#b8b8b8"/>
    </linearGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8c8d0"/>
      <stop offset="50%" stop-color="#f0f0f5"/>
      <stop offset="100%" stop-color="#c8c8d0"/>
    </linearGradient>
    <radialGradient id="diamond" cx="38%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0f8ff"/>
      <stop offset="60%" stop-color="#d8eaff"/>
      <stop offset="100%" stop-color="#b0cce8"/>
    </radialGradient>
    <radialGradient id="diamondShine" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="largeDiamond" cx="42%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f0f8ff"/>
      <stop offset="55%" stop-color="#d0e4ff"/>
      <stop offset="85%" stop-color="#b0cce8"/>
      <stop offset="100%" stop-color="#90b0d0"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000018"/>
    </filter>
    <filter id="diamondGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#b8d8ff30"/>
    </filter>
    <filter id="centerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#b8d8ff50"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Main choker arc - gentle curved band -->
    <path d="M55 195 Q100 175 150 165 Q200 158 256 155 Q312 158 362 165 Q412 175 457 195"
          fill="none" stroke="url(#platinum)" stroke-width="14" stroke-linecap="round"/>
    <!-- Choker highlight -->
    <path d="M60 193 Q105 173 152 163 Q202 156 256 153 Q310 156 360 163 Q407 173 452 193"
          fill="none" stroke="#f0f0f5" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <!-- Row of diamonds along the choker - top row -->
    <g filter="url(#diamondGlow)">
      <circle cx="100" cy="178" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="120" cy="173" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="140" cy="168" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="160" cy="164" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="180" cy="161" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="200" cy="158" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="220" cy="156" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="240" cy="155" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="256" cy="155" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="272" cy="155" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="292" cy="156" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="312" cy="158" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="332" cy="161" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="352" cy="164" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="372" cy="168" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="392" cy="173" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="412" cy="178" r="5" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
    </g>
    <!-- Bottom row of smaller diamonds -->
    <g filter="url(#diamondGlow)">
      <circle cx="130" cy="180" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="150" cy="176" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="170" cy="172" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="190" cy="169" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="210" cy="167" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="230" cy="165" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="256" cy="165" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="282" cy="165" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="302" cy="167" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="322" cy="169" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="342" cy="172" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="362" cy="176" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
      <circle cx="382" cy="180" r="4" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
    </g>
    <!-- Center pendant drop connector -->
    <line x1="256" y1="165" x2="256" y2="195" stroke="url(#silver)" stroke-width="2.5"/>
    <!-- V-shape connector lines -->
    <path d="M240 170 L256 195 L272 170" fill="none" stroke="url(#silver)" stroke-width="1.5"/>
    <!-- Small accent diamonds on connector -->
    <circle cx="248" cy="182" r="3" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
    <circle cx="264" cy="182" r="3" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.3"/>
    <!-- Center pendant - large pear-shaped diamond -->
    <g filter="url(#centerGlow)">
      <path d="M256 200 Q232 212 228 240 Q226 260 256 290 Q286 260 284 240 Q280 212 256 200 Z"
            fill="url(#largeDiamond)" stroke="#90b0d0" stroke-width="0.8"/>
      <!-- Facets -->
      <path d="M256 200 L244 230 L256 270 L268 230 Z" fill="none" stroke="#a0c8e0" stroke-width="0.5" opacity="0.3"/>
      <path d="M228 240 L256 245 L284 240" fill="none" stroke="#a0c8e0" stroke-width="0.4" opacity="0.25"/>
      <path d="M236 220 L256 245 L276 220" fill="none" stroke="#a0c8e0" stroke-width="0.4" opacity="0.2"/>
      <path d="M256 200 L256 290" fill="none" stroke="#a0c8e0" stroke-width="0.3" opacity="0.2"/>
      <!-- Shine overlay -->
      <path d="M256 200 Q232 212 228 240 Q226 260 256 290 Q286 260 284 240 Q280 212 256 200 Z"
            fill="url(#diamondShine)"/>
      <!-- Sparkle -->
      <circle cx="248" cy="218" r="2" fill="white" opacity="0.5"/>
      <circle cx="244" cy="225" r="1" fill="white" opacity="0.7"/>
      <g transform="translate(250,215)" opacity="0.5">
        <line x1="-3" y1="0" x2="3" y2="0" stroke="white" stroke-width="0.6"/>
        <line x1="0" y1="-3" x2="0" y2="3" stroke="white" stroke-width="0.6"/>
      </g>
    </g>
    <!-- Sparkle highlights on choker diamonds -->
    <g fill="white">
      <circle cx="140" cy="166" r="1.2" opacity="0.6"/>
      <circle cx="200" cy="156" r="1" opacity="0.55"/>
      <circle cx="256" cy="153" r="1.3" opacity="0.65"/>
      <circle cx="312" cy="156" r="1" opacity="0.55"/>
      <circle cx="372" cy="166" r="1.1" opacity="0.6"/>
    </g>
    <!-- End clasps -->
    <rect x="48" y="189" width="10" height="10" rx="2" fill="url(#silver)" stroke="#a0a0a0" stroke-width="0.5"/>
    <rect x="454" y="189" width="10" height="10" rx="2" fill="url(#silver)" stroke="#a0a0a0" stroke-width="0.5"/>
  </g>
</svg>