<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="100%" stop-color="#ede8e1"/>
    </linearGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8d8e0"/>
      <stop offset="35%" stop-color="#f0f0f5"/>
      <stop offset="55%" stop-color="#e0e0e8"/>
      <stop offset="100%" stop-color="#c8c8d0"/>
    </linearGradient>
    <linearGradient id="platHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d0d0d8"/>
      <stop offset="50%" stop-color="#f8f8ff"/>
      <stop offset="100%" stop-color="#d0d0d8"/>
    </linearGradient>
    <linearGradient id="platInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b8c0"/>
      <stop offset="50%" stop-color="#d0d0d8"/>
      <stop offset="100%" stop-color="#b8b8c0"/>
    </linearGradient>
    <radialGradient id="emeraldDiamond" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#f0f8ff"/>
      <stop offset="50%" stop-color="#e0efff"/>
      <stop offset="80%" stop-color="#c8e0ff"/>
      <stop offset="100%" stop-color="#a8c8e8"/>
    </radialGradient>
    <linearGradient id="diamondFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f8ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d0e8ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000022"/>
    </filter>
    <filter id="diamondGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#c8e0ff50"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Back of ring band -->
    <path d="M161 310 Q161 355 210 372 Q240 382 272 372 Q322 355 351 310"
          fill="none" stroke="url(#platInner)" stroke-width="16" stroke-linecap="round" opacity="0.45"/>
    <!-- Front ring band -->
    <path d="M161 310 Q161 262 200 244 Q222 235 242 233 L270 233 Q290 235 310 244 Q351 262 351 310"
          fill="none" stroke="url(#platinum)" stroke-width="18" stroke-linecap="round"/>
    <!-- Band highlight -->
    <path d="M165 308 Q165 265 202 247 Q223 238 243 236 L269 236 Q289 238 308 247 Q347 265 347 308"
          fill="none" stroke="url(#platHighlight)" stroke-width="5" opacity="0.45" stroke-linecap="round"/>
    <!-- Lower band -->
    <path d="M161 310 Q161 355 210 372 Q240 382 272 372 Q322 355 351 310"
          fill="none" stroke="url(#platinum)" stroke-width="16" stroke-linecap="round"/>
    <!-- Side baguette prongs left -->
    <path d="M218 234 L210 215 L205 195" fill="none" stroke="url(#platinum)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M228 233 L224 215 L222 195" fill="none" stroke="url(#platinum)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Side baguette prongs right -->
    <path d="M294 234 L302 215 L307 195" fill="none" stroke="url(#platinum)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M284 233 L288 215 L290 195" fill="none" stroke="url(#platinum)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Corner prongs -->
    <path d="M236 233 L232 208 L215 168" fill="none" stroke="url(#platinum)" stroke-width="3" stroke-linecap="round"/>
    <path d="M276 233 L280 208 L297 168" fill="none" stroke="url(#platinum)" stroke-width="3" stroke-linecap="round"/>
    <!-- Emerald cut diamond - rectangular with cut corners -->
    <g filter="url(#diamondGlow)">
      <path d="M215 168 L230 145 L282 145 L297 168 L297 200 L282 215 L230 215 L215 200 Z"
            fill="url(#emeraldDiamond)" stroke="#a0c0d8" stroke-width="0.8"/>
      <!-- Step-cut facets - horizontal lines -->
      <path d="M220 175 L292 175" stroke="#b0d0e8" stroke-width="0.6" opacity="0.4"/>
      <path d="M218 185 L294 185" stroke="#b0d0e8" stroke-width="0.5" opacity="0.35"/>
      <path d="M218 195 L294 195" stroke="#b0d0e8" stroke-width="0.5" opacity="0.3"/>
      <path d="M222 165 L290 165" stroke="#b0d0e8" stroke-width="0.5" opacity="0.35"/>
      <path d="M225 155 L287 155" stroke="#b0d0e8" stroke-width="0.5" opacity="0.3"/>
      <!-- Vertical center line -->
      <path d="M256 148 L256 212" stroke="#b0d0e8" stroke-width="0.4" opacity="0.25"/>
      <!-- Corner facet lines -->
      <path d="M215 168 L230 175" stroke="#b0d0e8" stroke-width="0.4" opacity="0.3"/>
      <path d="M297 168 L282 175" stroke="#b0d0e8" stroke-width="0.4" opacity="0.3"/>
      <path d="M215 200 L230 195" stroke="#b0d0e8" stroke-width="0.4" opacity="0.3"/>
      <path d="M297 200 L282 195" stroke="#b0d0e8" stroke-width="0.4" opacity="0.3"/>
      <!-- Light reflection gradient -->
      <rect x="225" y="150" width="62" height="22" rx="1" fill="white" opacity="0.12"/>
      <!-- Sparkle -->
      <g transform="translate(245,160)" opacity="0.55">
        <line x1="-4" y1="0" x2="4" y2="0" stroke="white" stroke-width="0.8"/>
        <line x1="0" y1="-4" x2="0" y2="4" stroke="white" stroke-width="0.8"/>
        <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="white" stroke-width="0.5"/>
        <line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" stroke="white" stroke-width="0.5"/>
      </g>
      <circle cx="270" cy="170" r="1.5" fill="white" opacity="0.5"/>
      <circle cx="240" cy="190" r="1" fill="white" opacity="0.35"/>
    </g>
    <!-- Side accent stones (small baguettes) -->
    <rect x="200" y="192" width="12" height="18" rx="1" fill="url(#emeraldDiamond)" stroke="#a0c0d8" stroke-width="0.4" opacity="0.7"/>
    <rect x="300" y="192" width="12" height="18" rx="1" fill="url(#emeraldDiamond)" stroke="#a0c0d8" stroke-width="0.4" opacity="0.7"/>
  </g>
</svg>