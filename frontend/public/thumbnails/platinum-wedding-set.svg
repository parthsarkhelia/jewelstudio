<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="100%" stop-color="#ede8e1"/>
    </linearGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8d8e0"/>
      <stop offset="35%" stop-color="#f0f0f5"/>
      <stop offset="55%" stop-color="#e0e0e8"/>
      <stop offset="100%" stop-color="#c8c8d0"/>
    </linearGradient>
    <linearGradient id="platHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d0d0d8"/>
      <stop offset="50%" stop-color="#f8f8ff"/>
      <stop offset="100%" stop-color="#d0d0d8"/>
    </linearGradient>
    <linearGradient id="platInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b8c0"/>
      <stop offset="50%" stop-color="#d0d0d8"/>
      <stop offset="100%" stop-color="#b8b8c0"/>
    </linearGradient>
    <linearGradient id="platDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8a8b0"/>
      <stop offset="100%" stop-color="#909098"/>
    </linearGradient>
    <radialGradient id="diamond" cx="45%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0f8ff"/>
      <stop offset="65%" stop-color="#d0e4ff"/>
      <stop offset="100%" stop-color="#a8c8e8"/>
    </radialGradient>
    <radialGradient id="diamondShine" cx="32%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#00000020"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Engagement ring (back, slightly overlapping) -->
  <g filter="url(#shadow)" transform="translate(-30, -15) rotate(-8, 270, 280)">
    <!-- Back band -->
    <path d="M185 290 Q185 330 225 345 Q252 352 278 345 Q318 330 335 290"
          fill="none" stroke="url(#platInner)" stroke-width="14" stroke-linecap="round" opacity="0.4"/>
    <!-- Front band -->
    <path d="M185 290 Q185 248 218 234 Q238 226 256 224 L278 224 Q296 226 314 234 Q335 248 335 290"
          fill="none" stroke="url(#platinum)" stroke-width="16" stroke-linecap="round"/>
    <!-- Band highlight -->
    <path d="M189 288 Q189 250 220 237 Q239 230 257 228 L277 228 Q295 230 312 237 Q331 250 331 288"
          fill="none" stroke="url(#platHighlight)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <!-- Lower band -->
    <path d="M185 290 Q185 330 225 345 Q252 352 278 345 Q318 330 335 290"
          fill="none" stroke="url(#platinum)" stroke-width="14" stroke-linecap="round"/>
    <!-- Prongs -->
    <path d="M242 225 L236 200 L240 175" fill="none" stroke="url(#platinum)" stroke-width="3" stroke-linecap="round"/>
    <path d="M278 225 L284 200 L280 175" fill="none" stroke="url(#platinum)" stroke-width="3" stroke-linecap="round"/>
    <path d="M255 224 L253 200 L252 178" fill="none" stroke="url(#platinum)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M268 224 L270 200 L268 178" fill="none" stroke="url(#platinum)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Diamond -->
    <path d="M235 178 L248 158 L262 152 L276 158 L288 178 L262 208 Z"
          fill="url(#diamond)" stroke="#a0c0d8" stroke-width="0.5"/>
    <!-- Facets -->
    <path d="M235 178 L262 188 L288 178" fill="none" stroke="#b0d0e8" stroke-width="0.6" opacity="0.5"/>
    <path d="M248 158 L262 188" fill="none" stroke="#b0d0e8" stroke-width="0.4" opacity="0.4"/>
    <path d="M276 158 L262 188" fill="none" stroke="#b0d0e8" stroke-width="0.4" opacity="0.4"/>
    <path d="M262 152 L262 208" fill="none" stroke="#b0d0e8" stroke-width="0.3" opacity="0.3"/>
    <!-- Shine -->
    <path d="M235 178 L248 158 L262 152 L276 158 L288 178 L262 208 Z" fill="url(#diamondShine)"/>
    <!-- Sparkle -->
    <circle cx="252" cy="163" r="1.8" fill="white" opacity="0.7"/>
    <circle cx="272" cy="170" r="1.2" fill="white" opacity="0.5"/>
  </g>
  <!-- Wedding band (front, interlocking) -->
  <g filter="url(#shadow)" transform="translate(30, 15) rotate(5, 240, 280)">
    <!-- Back band -->
    <path d="M165 290 Q165 335 212 352 Q242 362 268 352 Q318 335 335 290"
          fill="none" stroke="url(#platInner)" stroke-width="18" stroke-linecap="round" opacity="0.35"/>
    <!-- Front band - wider/thicker wedding band -->
    <path d="M165 290 Q165 245 205 228 Q226 220 245 218 L268 218 Q288 220 308 228 Q335 245 335 290"
          fill="none" stroke="url(#platinum)" stroke-width="22" stroke-linecap="round"/>
    <!-- Band highlight -->
    <path d="M170 288 Q170 248 207 232 Q228 224 246 222 L267 222 Q286 224 306 232 Q331 248 331 288"
          fill="none" stroke="url(#platHighlight)" stroke-width="6" opacity="0.45" stroke-linecap="round"/>
    <!-- Lower band -->
    <path d="M165 290 Q165 335 212 352 Q242 362 268 352 Q318 335 335 290"
          fill="none" stroke="url(#platinum)" stroke-width="20" stroke-linecap="round"/>
    <!-- Engraved milgrain detail on wedding band -->
    <g opacity="0.12" fill="url(#platDark)">
      <circle cx="200" cy="235" r="1.5"/>
      <circle cx="210" cy="230" r="1.5"/>
      <circle cx="220" cy="226" r="1.5"/>
      <circle cx="230" cy="222" r="1.5"/>
      <circle cx="240" cy="220" r="1.5"/>
      <circle cx="250" cy="219" r="1.5"/>
      <circle cx="260" cy="219" r="1.5"/>
      <circle cx="270" cy="220" r="1.5"/>
      <circle cx="280" cy="222" r="1.5"/>
      <circle cx="290" cy="226" r="1.5"/>
      <circle cx="300" cy="230" r="1.5"/>
      <circle cx="310" cy="236" r="1.5"/>
    </g>
    <!-- Small channel-set diamonds in the wedding band -->
    <g>
      <circle cx="225" cy="226" r="3.5" fill="url(#diamond)" stroke="#b0c0d0" stroke-width="0.3"/>
      <circle cx="240" cy="221" r="3.5" fill="url(#diamond)" stroke="#b0c0d0" stroke-width="0.3"/>
      <circle cx="255" cy="219" r="3.5" fill="url(#diamond)" stroke="#b0c0d0" stroke-width="0.3"/>
      <circle cx="270" cy="220" r="3.5" fill="url(#diamond)" stroke="#b0c0d0" stroke-width="0.3"/>
      <circle cx="285" cy="224" r="3.5" fill="url(#diamond)" stroke="#b0c0d0" stroke-width="0.3"/>
    </g>
    <!-- Diamond sparkles -->
    <g fill="white" opacity="0.5">
      <circle cx="224" cy="224" r="1"/>
      <circle cx="254" cy="217" r="1.2"/>
      <circle cx="284" cy="222" r="0.8"/>
    </g>
  </g>
</svg>