<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="100%" stop-color="#ede8e1"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="35%" stop-color="#e8e8e8"/>
      <stop offset="65%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <radialGradient id="sapphire" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#4466cc"/>
      <stop offset="35%" stop-color="#3355aa"/>
      <stop offset="70%" stop-color="#1a3a8a"/>
      <stop offset="100%" stop-color="#112266"/>
    </radialGradient>
    <radialGradient id="sapphireShine" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#88aaff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#88aaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloDiamond" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#b8d8ff"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000022"/>
    </filter>
    <filter id="sapphireGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#1a3a8a40"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Chain -->
  <g opacity="0.9">
    <path d="M110 55 Q135 50 160 54 Q185 60 210 72 Q232 85 248 102 Q258 115 260 132"
          fill="none" stroke="url(#chain)" stroke-width="3" stroke-linecap="round"/>
    <path d="M402 55 Q377 50 352 54 Q327 60 302 72 Q280 85 264 102 Q254 115 252 132"
          fill="none" stroke="url(#chain)" stroke-width="3" stroke-linecap="round"/>
    <!-- Chain link texture -->
    <g fill="none" stroke="#d8d8d8" stroke-width="0.8" opacity="0.5">
      <ellipse cx="135" cy="52" rx="4" ry="2.5"/>
      <ellipse cx="152" cy="54" rx="4" ry="2.5"/>
      <ellipse cx="170" cy="58" rx="4" ry="2.5"/>
      <ellipse cx="188" cy="64" rx="4" ry="2.5"/>
      <ellipse cx="205" cy="73" rx="4" ry="2.5"/>
      <ellipse cx="220" cy="83" rx="4" ry="2.5"/>
      <ellipse cx="235" cy="95" rx="4" ry="2.5"/>
      <ellipse cx="360" cy="53" rx="4" ry="2.5"/>
      <ellipse cx="342" cy="56" rx="4" ry="2.5"/>
      <ellipse cx="325" cy="61" rx="4" ry="2.5"/>
      <ellipse cx="308" cy="68" rx="4" ry="2.5"/>
      <ellipse cx="292" cy="77" rx="4" ry="2.5"/>
      <ellipse cx="278" cy="88" rx="4" ry="2.5"/>
    </g>
  </g>
  <g filter="url(#shadow)">
    <!-- Pendant bail -->
    <path d="M250 132 Q250 115 256 110 Q262 115 262 132 L262 150 L250 150 Z"
          fill="url(#silver)" stroke="#a0a0a0" stroke-width="0.5"/>
    <!-- Connector -->
    <rect x="251" y="148" width="10" height="14" rx="2" fill="url(#silver)" stroke="#a0a0a0" stroke-width="0.5"/>
    <!-- Pendant outer frame -->
    <circle cx="256" cy="245" r="82" fill="url(#silver)" stroke="#a0a0a0" stroke-width="1"/>
    <circle cx="256" cy="245" r="76" fill="#eae8e4" stroke="#c8c8c8" stroke-width="0.5"/>
    <!-- Halo diamonds - ring of small stones -->
    <g>
      <circle cx="256" cy="178" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="276" cy="181" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="294" cy="190" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="308" cy="204" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="318" cy="222" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="321" cy="243" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="318" cy="264" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="308" cy="282" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="294" cy="296" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="276" cy="305" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="256" cy="308" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="236" cy="305" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="218" cy="296" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="204" cy="282" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="194" cy="264" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="191" cy="243" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="194" cy="222" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="204" cy="204" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="218" cy="190" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
      <circle cx="236" cy="181" r="6.5" fill="url(#haloDiamond)" stroke="#a0c0e0" stroke-width="0.3"/>
    </g>
    <!-- Halo sparkles -->
    <g fill="white" opacity="0.65">
      <circle cx="254" cy="176" r="1.8"/>
      <circle cx="317" cy="220" r="1.4"/>
      <circle cx="192" cy="240" r="1.5"/>
      <circle cx="274" cy="303" r="1.2"/>
      <circle cx="206" cy="201" r="1.3"/>
    </g>
    <!-- Main sapphire stone -->
    <g filter="url(#sapphireGlow)">
      <circle cx="256" cy="243" r="52" fill="url(#sapphire)" stroke="#0a1a4a" stroke-width="0.8"/>
      <!-- Facets -->
      <path d="M256 191 L290 218 L280 268 L232 268 L222 218 Z" fill="none" stroke="#2244aa" stroke-width="0.5" opacity="0.3"/>
      <path d="M256 191 L256 243" fill="none" stroke="#3355bb" stroke-width="0.4" opacity="0.25"/>
      <path d="M222 218 L256 243 L290 218" fill="none" stroke="#3355bb" stroke-width="0.4" opacity="0.25"/>
      <path d="M232 268 L256 243 L280 268" fill="none" stroke="#3355bb" stroke-width="0.4" opacity="0.25"/>
      <!-- Shine overlay -->
      <circle cx="256" cy="243" r="52" fill="url(#sapphireShine)"/>
      <!-- Sparkle highlights -->
      <circle cx="240" cy="222" r="3" fill="white" opacity="0.2"/>
      <circle cx="245" cy="215" r="1.5" fill="white" opacity="0.4"/>
    </g>
  </g>
</svg>