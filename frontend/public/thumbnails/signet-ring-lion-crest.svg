<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="100%" stop-color="#ede8e1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a84b"/>
      <stop offset="35%" stop-color="#f5d998"/>
      <stop offset="60%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#b8922f"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8922f"/>
      <stop offset="100%" stop-color="#8a6e22"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c49a3c"/>
      <stop offset="50%" stop-color="#fffbe6"/>
      <stop offset="100%" stop-color="#c49a3c"/>
    </linearGradient>
    <linearGradient id="signetFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d998"/>
      <stop offset="20%" stop-color="#e8c470"/>
      <stop offset="80%" stop-color="#c49a3c"/>
      <stop offset="100%" stop-color="#b8922f"/>
    </linearGradient>
    <linearGradient id="engraveDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6e22"/>
      <stop offset="100%" stop-color="#6a5018"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#00000022"/>
    </filter>
    <filter id="engraveDepth">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" flood-color="#6a501830"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Ring band back -->
    <path d="M155 320 Q155 370 208 388 Q240 398 272 388 Q325 370 345 320"
          fill="none" stroke="url(#goldDark)" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
    <!-- Ring band front - wider/chunkier for signet -->
    <path d="M155 320 Q155 268 198 248 Q220 238 242 235 L270 235 Q292 238 312 248 Q345 268 345 320"
          fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round"/>
    <!-- Band highlight -->
    <path d="M160 318 Q160 272 200 252 Q222 242 243 239 L269 239 Q290 242 310 252 Q340 272 340 318"
          fill="none" stroke="url(#goldHighlight)" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
    <!-- Lower band -->
    <path d="M155 320 Q155 370 208 388 Q240 398 272 388 Q325 370 345 320"
          fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    <!-- Shoulders flaring up to signet face -->
    <path d="M195 246 Q192 230 198 210 Q208 185 220 175"
          fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
    <path d="M315 246 Q318 230 312 210 Q302 185 290 175"
          fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
    <!-- Shoulder highlights -->
    <path d="M198 242 Q196 228 201 212 Q210 190 220 180"
          fill="none" stroke="url(#goldHighlight)" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
    <path d="M312 242 Q314 228 309 212 Q300 190 290 180"
          fill="none" stroke="url(#goldHighlight)" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
    <!-- Signet face - oval platform -->
    <ellipse cx="255" cy="162" rx="52" ry="45" fill="url(#signetFace)" stroke="url(#goldDark)" stroke-width="2"/>
    <!-- Beveled edge of signet face -->
    <ellipse cx="255" cy="162" rx="48" ry="41" fill="none" stroke="url(#goldHighlight)" stroke-width="1.5" opacity="0.4"/>
    <!-- Lion crest engraving -->
    <g filter="url(#engraveDepth)" transform="translate(255,158)" opacity="0.55" stroke="url(#engraveDark)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Lion head outline -->
      <path d="M0 -22 Q-8 -28 -15 -25 Q-20 -22 -20 -15 Q-22 -8 -18 -2"/>
      <path d="M0 -22 Q8 -28 15 -25 Q20 -22 20 -15 Q22 -8 18 -2"/>
      <!-- Mane -->
      <path d="M-20 -15 Q-25 -12 -26 -5 Q-26 2 -22 6"/>
      <path d="M20 -15 Q25 -12 26 -5 Q26 2 22 6"/>
      <path d="M-22 6 Q-24 12 -20 16"/>
      <path d="M22 6 Q24 12 20 16"/>
      <!-- Face details -->
      <circle cx="-7" cy="-12" r="2.5" stroke-width="1.2"/>
      <circle cx="7" cy="-12" r="2.5" stroke-width="1.2"/>
      <!-- Nose -->
      <path d="M-3 -5 Q0 -2 3 -5" stroke-width="1.5"/>
      <!-- Mouth -->
      <path d="M-6 2 Q-3 6 0 4 Q3 6 6 2" stroke-width="1.2"/>
      <!-- Crown above lion -->
      <path d="M-12 -28 L-8 -32 L-4 -28 L0 -34 L4 -28 L8 -32 L12 -28" stroke-width="1.5"/>
      <line x1="-12" y1="-28" x2="12" y2="-28" stroke-width="1.5"/>
      <!-- Shield outline around lion -->
      <path d="M-20 16 Q-18 24 -10 28 Q0 32 10 28 Q18 24 20 16"/>
    </g>
    <!-- Subtle highlight on face -->
    <ellipse cx="250" cy="150" rx="20" ry="15" fill="white" opacity="0.06"/>
  </g>
</svg>