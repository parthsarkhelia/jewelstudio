<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="100%" stop-color="#ede8e1"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="35%" stop-color="#e8e8e8"/>
      <stop offset="65%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="silverLink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#b8b8b8"/>
    </linearGradient>
    <radialGradient id="diamond" cx="38%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0f8ff"/>
      <stop offset="60%" stop-color="#d8eaff"/>
      <stop offset="100%" stop-color="#b0cce8"/>
    </radialGradient>
    <radialGradient id="diamondShine" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000020"/>
    </filter>
    <filter id="diamondGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#b8d8ff40"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Bracelet follows a gentle S-curve across the canvas -->
    <!-- Silver link chain base -->
    <path d="M80 180 Q120 160 170 170 Q220 182 256 210 Q292 238 330 255 Q380 275 430 260"
          fill="none" stroke="url(#silverLink)" stroke-width="16" stroke-linecap="round"/>
    <!-- Highlight on chain -->
    <path d="M84 178 Q122 158 170 168 Q218 180 255 207 Q290 234 328 252 Q376 271 426 258"
          fill="none" stroke="#e8e8e8" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <!-- Diamond stones along the curve -->
    <g filter="url(#diamondGlow)">
      <!-- Each diamond is a small circle with gradient -->
      <circle cx="90" cy="178" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="90" cy="178" r="8" fill="url(#diamondShine)"/>
      <circle cx="108" cy="173" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="108" cy="173" r="8" fill="url(#diamondShine)"/>
      <circle cx="126" cy="169" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="126" cy="169" r="8" fill="url(#diamondShine)"/>
      <circle cx="145" cy="168" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="145" cy="168" r="8" fill="url(#diamondShine)"/>
      <circle cx="164" cy="170" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="164" cy="170" r="8" fill="url(#diamondShine)"/>
      <circle cx="183" cy="175" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="183" cy="175" r="8" fill="url(#diamondShine)"/>
      <circle cx="201" cy="183" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="201" cy="183" r="8" fill="url(#diamondShine)"/>
      <circle cx="219" cy="193" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="219" cy="193" r="8" fill="url(#diamondShine)"/>
      <circle cx="237" cy="204" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="237" cy="204" r="8" fill="url(#diamondShine)"/>
      <circle cx="256" cy="215" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="256" cy="215" r="8" fill="url(#diamondShine)"/>
      <circle cx="275" cy="226" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="275" cy="226" r="8" fill="url(#diamondShine)"/>
      <circle cx="293" cy="236" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="293" cy="236" r="8" fill="url(#diamondShine)"/>
      <circle cx="312" cy="244" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="312" cy="244" r="8" fill="url(#diamondShine)"/>
      <circle cx="331" cy="250" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="331" cy="250" r="8" fill="url(#diamondShine)"/>
      <circle cx="351" cy="254" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="351" cy="254" r="8" fill="url(#diamondShine)"/>
      <circle cx="371" cy="258" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="371" cy="258" r="8" fill="url(#diamondShine)"/>
      <circle cx="390" cy="260" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="390" cy="260" r="8" fill="url(#diamondShine)"/>
      <circle cx="409" cy="260" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="409" cy="260" r="8" fill="url(#diamondShine)"/>
      <circle cx="427" cy="258" r="8" fill="url(#diamond)" stroke="#a0b8d0" stroke-width="0.4"/>
      <circle cx="427" cy="258" r="8" fill="url(#diamondShine)"/>
    </g>
    <!-- Silver prong setting marks between stones -->
    <g stroke="url(#silver)" stroke-width="1.2" opacity="0.35">
      <line x1="99" y1="174" x2="99" y2="180"/>
      <line x1="117" y1="170" x2="117" y2="176"/>
      <line x1="135" y1="168" x2="135" y2="174"/>
      <line x1="154" y1="168" x2="154" y2="174"/>
      <line x1="173" y1="172" x2="173" y2="178"/>
      <line x1="192" y1="178" x2="192" y2="184"/>
      <line x1="210" y1="187" x2="210" y2="193"/>
      <line x1="228" y1="198" x2="228" y2="204"/>
      <line x1="247" y1="209" x2="247" y2="215"/>
      <line x1="265" y1="220" x2="265" y2="226"/>
      <line x1="284" y1="230" x2="284" y2="236"/>
      <line x1="302" y1="239" x2="302" y2="245"/>
      <line x1="321" y1="247" x2="321" y2="253"/>
      <line x1="341" y1="252" x2="341" y2="258"/>
      <line x1="361" y1="256" x2="361" y2="262"/>
      <line x1="380" y1="259" x2="380" y2="265"/>
      <line x1="399" y1="260" x2="399" y2="266"/>
      <line x1="418" y1="259" x2="418" y2="265"/>
    </g>
    <!-- Sparkle highlights on select diamonds -->
    <g fill="white">
      <circle cx="126" cy="166" r="1.5" opacity="0.7"/>
      <circle cx="201" cy="180" r="1.2" opacity="0.6"/>
      <circle cx="275" cy="223" r="1.3" opacity="0.65"/>
      <circle cx="351" cy="251" r="1.4" opacity="0.6"/>
      <circle cx="90" cy="175" r="1" opacity="0.5"/>
      <circle cx="331" cy="247" r="1.1" opacity="0.55"/>
    </g>
    <!-- Clasp at one end -->
    <rect x="70" y="174" width="10" height="10" rx="2" fill="url(#silver)" stroke="#a0a0a0" stroke-width="0.5"/>
  </g>
</svg>